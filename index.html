<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生意興隆・誠摯祝賀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF3E2;
    --cream-deep:#F1E6CC;
    --charcoal:#241F1A;
    --charcoal-2:#332B23;
    --orange:#F0871F;
    --orange-deep:#D9531E;
    --gold:#F4BE3D;
    --lime:#8FBF3F;
    --leaf:#3C7A30;
    --ink:#20190F;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }

  .content{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='160'><g fill='none'><rect x='50' y='18' width='16' height='26' rx='3' fill='%23D9531E' opacity='0.09'/><rect x='50' y='29' width='16' height='3' fill='%23F4BE3D' opacity='0.12'/><line x1='58' y1='6' x2='58' y2='18' stroke='%23F4BE3D' stroke-width='1.6' opacity='0.14'/><circle cx='34' cy='54' r='2.2' fill='%23F4BE3D' opacity='0.16'/><circle cx='80' cy='62' r='1.8' fill='%23D9531E' opacity='0.14'/><circle cx='90' cy='30' r='1.6' fill='%238FBF3F' opacity='0.14'/><rect x='14' y='96' width='13' height='22' rx='3' fill='%23D9531E' opacity='0.08' transform='rotate(-14 20 107)'/><line x1='20' y1='84' x2='21' y2='96' stroke='%23F4BE3D' stroke-width='1.4' opacity='0.12' transform='rotate(-14 20 107)'/><circle cx='100' cy='120' r='2' fill='%23F4BE3D' opacity='0.13'/><circle cx='70' cy='140' r='1.6' fill='%23D9531E' opacity='0.11'/></g></svg>");
    background-repeat: repeat;
    background-size: 120px 160px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  .scene{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---- top slatted signboard band ---- */
  .signband{
    position:relative;
    width:100%;
    height:min(30vh, 240px);
    background:
      repeating-linear-gradient(
        90deg,
        var(--charcoal) 0px,
        var(--charcoal-2) 3px,
        var(--charcoal) 7px,
        #1a1510 10px
      );
    box-shadow: inset 0 -12px 24px -12px rgba(0,0,0,0.6);
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .signband::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:8px;
    background:linear-gradient(180deg, rgba(255,255,255,0.08), transparent);
  }

  .emblem-wrap{
    position:relative;
    transform:translateY(38%);
    opacity:0;
    animation: riseIn 900ms 200ms cubic-bezier(.2,.8,.2,1) forwards;
  }

  @keyframes riseIn{
    to{ opacity:1; transform:translateY(38%) scale(1); }
    from{ opacity:0; transform:translateY(46%) scale(.92); }
  }

  .emblem-ring{
    width:min(46vw, 260px);
    height:min(46vw, 260px);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFFDF7, var(--cream-deep) 78%);
    border:10px solid var(--charcoal-2);
    box-shadow:
      0 18px 40px rgba(0,0,0,0.35),
      inset 0 0 0 2px rgba(0,0,0,0.06);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .emblem-ring svg{ width:100%; height:100%; }

  /* ---- main content ---- */
  .content{
    width:100%;
    max-width:640px;
    padding: calc(min(23vw, 130px) + 28px) 28px 64px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .eyebrow{
    margin:0 0 6px;
    letter-spacing:0.5em;
    font-size:13px;
    font-weight:700;
    color:var(--leaf);
    opacity:0;
    animation: fadeUp 700ms 700ms ease forwards;
  }

  .headline{
    font-family:'Ma Shan Zheng', cursive;
    font-size:clamp(64px, 16vw, 108px);
    line-height:1;
    margin:6px 0 18px;
    color:var(--orange-deep);
    text-shadow:
      2px 2px 0 rgba(244,190,61,0.55),
      0 6px 18px rgba(217,83,30,0.25);
    opacity:0;
    animation: fadeUp 800ms 850ms cubic-bezier(.2,.8,.2,1) forwards;
  }

  .wish{
    font-size:clamp(18px, 4.4vw, 23px);
    font-weight:700;
    line-height:1.9;
    color:var(--ink);
    margin:0 0 30px;
    opacity:0;
    animation: fadeUp 800ms 1050ms ease forwards;
  }
  .wish .accent{ color:var(--orange-deep); }
  .wish .accent2{ color:var(--leaf); }

  .photo-card{
    margin: 6px 0 34px;
    padding:10px 10px 26px;
    background:#fffdf8;
    border-radius:6px;
    box-shadow:
      0 14px 30px rgba(36,31,26,0.22),
      0 2px 6px rgba(36,31,26,0.12);
    transform: rotate(-2.2deg);
    max-width:340px;
    width:82%;
    opacity:0;
    animation: fadeUp 800ms 1120ms ease forwards;
  }
  .photo-card img{
    display:block;
    width:100%;
    height:auto;
    border-radius:2px;
  }
  .photo-card .cap{
    display:block;
    text-align:center;
    margin-top:12px;
    font-family:'Ma Shan Zheng', cursive;
    font-size:18px;
    color:var(--leaf);
    letter-spacing:0.15em;
  }

  .divider{
    display:flex;
    gap:14px;
    align-items:center;
    margin:6px 0 30px;
    opacity:0;
    animation: fadeUp 800ms 1200ms ease forwards;
  }
  .divider .line{ width:46px; height:2px; background:var(--gold); border-radius:2px; }
  .divider svg{ width:26px; height:26px; }

  .signoff{
    font-size:15px;
    letter-spacing:0.3em;
    color:#7a6f5c;
    line-height:2.1;
    opacity:0;
    animation: fadeUp 800ms 1350ms ease forwards;
  }
  .signoff strong{
    display:block;
    font-size:19px;
    letter-spacing:0.5em;
    color:var(--ink);
    font-weight:700;
    margin-bottom:2px;
  }

  .from{
    margin-top:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    opacity:0;
    animation: fadeUp 800ms 1450ms ease forwards;
  }
  .from .dash{ width:26px; height:1.5px; background:var(--gold); border-radius:2px; }
  .from .name{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:0.15em;
    color:var(--orange-deep);
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---- hanging firecrackers ---- */
  .firecrackers{
    position:absolute;
    top:0; left:0; right:0;
    height:0;
    z-index:5;
    pointer-events:none;
  }
  .cracker{
    position:absolute;
    top:-6px;
    width:56px;
    transform-origin: 50% 0%;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
  }
  .cracker.left{ left:4%; animation: swingL 3.4s ease-in-out infinite; }
  .cracker.right{ right:4%; animation: swingR 3.7s ease-in-out infinite 0.3s; }

  @keyframes swingL{
    0%,100%{ transform: rotate(-6deg); }
    50%{ transform: rotate(4deg); }
  }
  @keyframes swingR{
    0%,100%{ transform: rotate(6deg); }
    50%{ transform: rotate(-4deg); }
  }

  .cracker .spark{
    transform-box: fill-box;
    transform-origin: center;
    opacity:0;
    animation: pop 2.8s ease-in-out infinite;
  }
  .cracker .smoke{
    transform-box: fill-box;
    transform-origin: center;
    opacity:0;
    animation: puff 2.8s ease-out infinite;
  }
  .cracker.left .spark, .cracker.left .smoke{ animation-delay: 0s; }
  .cracker.right .spark, .cracker.right .smoke{ animation-delay: 1.1s; }

  @keyframes pop{
    0%, 78%{ opacity:0; transform:scale(0.2) translateY(0); }
    84%{ opacity:1; transform:scale(1.15) translateY(-2px); }
    92%{ opacity:0.9; transform:scale(1) translateY(-5px); }
    100%{ opacity:0; transform:scale(0.5) translateY(-10px); }
  }
  @keyframes puff{
    0%, 80%{ opacity:0; transform:scale(0.6) translateY(0); }
    88%{ opacity:0.35; transform:scale(1.1) translateY(-6px); }
    100%{ opacity:0; transform:scale(1.6) translateY(-18px); }
  }
  .confetti{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .confetti span{
    position:absolute;
    display:block;
    opacity:0;
    animation: sparkle 3.6s ease-in-out infinite;
  }
  @keyframes sparkle{
    0%{ opacity:0; transform:translateY(0) scale(0.6) rotate(0deg); }
    12%{ opacity:1; }
    50%{ opacity:0.85; transform:translateY(-14px) scale(1) rotate(30deg); }
    100%{ opacity:0; transform:translateY(-28px) scale(0.6) rotate(60deg); }
  }
</style>
</head>
<body>
<div class="scene">

  <div class="firecrackers" aria-hidden="true">
    <svg class="cracker left" viewBox="0 0 56 200" xmlns="http://www.w3.org/2000/svg">

        <rect x="14" y="30" width="28" height="4" fill="#F4BE3D" opacity="0.85"/>

      <g fill="#F4BE3D">

        <circle class="spark" style="animation-delay:0.08s" cx="48" cy="146" r="2.2"/>

        <circle class="spark" style="animation-delay:0.22s" cx="28" cy="168" r="1.8"/>
        <circle class="spark" style="animation-delay:0.13s" cx="20" cy="138" r="1.6"/>
      </g>
    </svg>

    <svg class="cracker right" viewBox="0 0 56 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fcBody2" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#C7440F"/>

      </defs>
      <line x1="28" y1="0" x2="28" y2="14" stroke="#F4BE3D" stroke-width="2"/>
      <g>
        <rect x="14" y="14" width="28" height="34" rx="4" fill="url(#fcBody2)"/>
        <rect x="14" y="26" width="28" height="4" fill="#F4BE3D" opacity="0.85"/>
        <line x1="28" y1="48" x2="28" y2="56" stroke="#F4BE3D" stroke-width="2"/>
        <rect x="14" y="56" width="28" height="34" rx="4" fill="url(#fcBody2)"/>

      <path d="M28 90 q -3 10 2 16 q 5 -4 3 -16 Z" fill="#F4BE3D"/>

        <circle class="spark" style="animation-delay:0.06s" cx="38" cy="114" r="1.8"/>
        <circle class="spark" style="animation-delay:0.24s" cx="28" cy="122" r="1.6"/>
      </g>
    </svg>
  </div>

  <div class="signband">
    <div class="emblem-wrap">
      <div class="emblem-ring">
        <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="orangeBody" cx="38%" cy="32%" r="75%">
              <stop offset="0%" stop-color="#FBC85B"/>
              <stop offset="55%" stop-color="#F0871F"/>
              <stop offset="100%" stop-color="#D9531E"/>
            </radialGradient>
            <radialGradient id="orangeCut" cx="50%" cy="45%" r="60%">
              <stop offset="0%" stop-color="#FFE39B"/>
              <stop offset="60%" stop-color="#F7B23B"/>
              <stop offset="100%" stop-color="#E2731F"/>
            </radialGradient>
            <radialGradient id="limeBody" cx="38%" cy="32%" r="75%">
              <stop offset="0%" stop-color="#C6E27A"/>
              <stop offset="55%" stop-color="#8FBF3F"/>

              <stop offset="60%" stop-color="#AED357"/>

          </defs>

          <!-- brand nod arc text -->
          <path id="arcTop" d="M 38 78 A 92 92 0 0 1 222 78" fill="none"/>
          <text font-family="'Ma Shan Zheng', cursive" font-size="20" fill="#3C7A30" letter-spacing="2">

            </g>
            <circle r="4" fill="#E2731F" opacity="0.7"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <main class="content">
    <p class="eyebrow">誠摯祝賀・開幕誌喜</p>
    <h1 class="headline">生意興隆</h1>
    <p class="wish">
      <span class="accent">柳橙</span>加<span class="accent2">檸檬</span>，酸甜剛剛好——<br>
      就像你的事業，越做越旺

<script>
  // gentle floating sparkles, gold + orange + lime tones
  const colors = ['#F4BE3D', '#F0871F', '#8FBF3F'];
  const wrap = document.querySelector('.confetti');
  const count = 16;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    const size = 4 + Math.random() * 5;
    s.style.left = Math.random() * 100 + '%';
    s.style.top = 10 + Math.random() * 80 + '%';
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.borderRadius = '50%';
    s.style.background = colors[i % colors.length];
    s.style.animationDelay = (Math.random() * 3.6) + 's';
    s.style.animationDuration = (3 + Math.random() * 2.2) + 's';
    wrap.appendChild(s);
  }
